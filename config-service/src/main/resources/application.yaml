spring:
  application:
    name: config-service

  cloud:
    config.server.git:
        uri: https://github.com/avish-20/crafty-config-server
        default-label: main

server.port: 8888



eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    discovery:
      enabled: false
    config.server.git:
      uri: https://github.com/avish-20/crafty-config-server

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false